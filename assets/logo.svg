<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="dark-2026">
  <defs>
    <!-- Pointy-top regular hexagon, circumradius 40, centered on the origin. -->
    <polygon id="hex" points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20"/>
  </defs>

  <!-- Canvas: the editor background, with the window-separator color as a rim
       so the card still has an edge on light backgrounds. -->
  <rect width="512" height="512" rx="64" fill="#121314"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="#2a2b2c" stroke-width="2"/>

  <!-- The 16 ANSI colors, normal (rows 1-2) above bright (rows 3-4). -->
  <g>
    <use href="#hex" x="90.64"  y="96"     fill="#202122"/><!--  0 black          -->
    <use href="#hex" x="185.14" y="96"     fill="#ff7b72"/><!--  1 red            -->
    <use href="#hex" x="279.64" y="96"     fill="#7ee787"/><!--  2 green          -->
    <use href="#hex" x="374.14" y="96"     fill="#cd9731"/><!--  3 yellow         -->

    <use href="#hex" x="137.89" y="202.67" fill="#79c0ff"/><!--  4 blue           -->
    <use href="#hex" x="232.39" y="202.67" fill="#d2a8ff"/><!--  5 magenta        -->
    <use href="#hex" x="326.89" y="202.67" fill="#4ec9b0"/><!--  6 cyan           -->
    <use href="#hex" x="421.39" y="202.67" fill="#bbbebf"/><!--  7 white          -->

    <use href="#hex" x="90.64"  y="309.33" fill="#555555"/><!--  8 bright black   -->
    <use href="#hex" x="185.14" y="309.33" fill="#ffa198"/><!--  9 bright red     -->
    <use href="#hex" x="279.64" y="309.33" fill="#91eb99"/><!-- 10 bright green   -->
    <use href="#hex" x="374.14" y="309.33" fill="#ffa657"/><!-- 11 bright yellow  -->

    <use href="#hex" x="137.89" y="416"    fill="#a5d6ff"/><!-- 12 bright blue    -->
    <use href="#hex" x="232.39" y="416"    fill="#b267e6"/><!-- 13 bright magenta -->
    <use href="#hex" x="326.89" y="416"    fill="#71d4c0"/><!-- 14 bright cyan    -->
    <use href="#hex" x="421.39" y="416"    fill="#ffffff"/><!-- 15 bright white   -->
  </g>
</svg>
